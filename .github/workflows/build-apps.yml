name: Build Mobile Apps

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"

jobs:
  build-customer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/customer
        run: npm install

      - name: Type check
        working-directory: apps/customer
        run: npx tsc --noEmit

  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: admin
        run: npm install

      - name: Build
        working-directory: admin
        run: npm run build
